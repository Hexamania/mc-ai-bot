name: Rust core

on:
  push:
    branches: [rust-rewrite]
  pull_request:
    branches: [rust-rewrite]

env:
  RUSTUP_TOOLCHAIN: nightly-2025-11-15

jobs:
  check-and-test:
    name: Check and test Rust core
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git to use LF line endings
        run: git config --global core.autocrlf false
      - name: Set cargo environment for git fetching
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt
      - name: Ensure rustfmt is installed
        run: |
          if (-not (Get-Command cargo-fmt -ErrorAction SilentlyContinue)) {
            rustup component add rustfmt --toolchain ${{ env.RUSTUP_TOOLCHAIN }} || echo "rustfmt not available for this toolchain, skipping format check"
          }
      - name: Verify toolchain
        run: rustc --version && cargo --version
      - name: Check formatting
        run: |
          if (Get-Command cargo-fmt -ErrorAction SilentlyContinue) {
            cargo fmt --manifest-path rust/Cargo.toml -- --check
          } else {
            Write-Host "rustfmt not available, skipping format check"
          }
      - name: Check all targets
        run: cargo check --all-targets --manifest-path rust/Cargo.toml
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml
