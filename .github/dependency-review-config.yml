# Dependency Review Configuration for Airi OS
# See https://github.com/actions/dependency-review-action

# Fail on these severity levels
fail-on-severity: high

# Allow these specific vulnerabilities (use sparingly!)
# allow-ghsas:
#   - GHSA-xxxx-xxxx-xxxx

# Deny these licenses (SPDX identifiers)
# deny-licenses:
#   - GPL-3.0-only
#   - AGPL-3.0-only

# Allow these licenses
allow-licenses:
  - MIT
  - ISC
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - MPL-2.0
  - Unlicense
  - CC0-1.0
  - Python-2.0

# Fail on scopes (production, development, etc.)
# fail-on-scopes:
#   - production

# Comment on PR with summary
comment-summary-in-pr: "always"
