[package]
name = "mc-ai-bot-core"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false

# Patch simd_cesu8 to fix array_chunks issue on Rust 1.85+
# The fix changes `remainder.array_chunks()` to `remainder.into_iter().array_chunks()`
# Patch simdnbt 0.6.1 to remove obsolete array_chunks feature gate (stabilized in Rust 1.97, gate removed in 1.93+)
[patch.crates-io]
simd_cesu8 = { git = "https://github.com/seancroach/simd_cesu8", rev = "v1.2.0" }
simdnbt = { path = "../vendor/simdnbt/simdnbt" }
simdnbt-derive = { path = "../vendor/simdnbt/simdnbt-derive" }

[dependencies]
azalea = "=0.10.3+mc1.21.1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "json", "form", "ws", "multipart"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
bevy_ecs = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = "9"
rand = { version = "=0.8.5", features = ["small_rng"] }
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "1"
socketioxide = "0.10"
tempfile = "3"
thiserror = "2"
time = "=0.3.55"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "fs",
] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
log = "0.4"
