[package]
name = "mc-ai-bot-core"
version = "0.1.0"
edition = "2021"
license = "ISC"
publish = false

[dependencies]
azalea = "=0.10.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "json", "form", "ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = { version = "9", features = ["chrono"] }
rand = { version = "=0.8.5", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketioxide = { version = "0.10", features = ["axum", "tower"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "fs",
] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression", "cookie", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
