name: Auto Format

on:
  push:
    branches: [rust-rewrite]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUSTUP_TOOLCHAIN: nightly-2026-01-01

jobs:
  fmt:
    name: Auto-format Rust code
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Configure git to use LF line endings
        run: git config --global core.autocrlf false
      - name: Set cargo environment for git fetching
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-01
          components: rustfmt

      - name: Verify toolchain
        run: rustc --version && cargo --version

      - name: Run cargo fmt
        run: cargo fmt --manifest-path rust/Cargo.toml

      - name: Check for changes
        id: fmt-check
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet rust/
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 0) {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No formatting changes needed"
          } else {
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Formatting changes detected"
          }
          exit 0

      - name: Commit and push formatting changes
        if: steps.fmt-check.outputs.changed == 'true'
        shell: pwsh
        run: |
          git add rust/
          git commit -m "style: auto-format with rustfmt`n`nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git pull --rebase
          git push