name: Rust core

on:
  push:
    branches: [rust-rewrite]
  pull_request:
    branches: [rust-rewrite]

env:
  RUSTUP_TOOLCHAIN: nightly-2025-01-15

jobs:
  check-and-test:
    name: Check and test Rust core
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git to use LF line endings
        run: git config --global core.autocrlf false
      - name: Set cargo environment for git fetching
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-01-15
          components: rustfmt
      - name: Verify toolchain
        run: rustc --version && cargo --version
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Check all targets
        run: cargo check --all-targets --manifest-path rust/Cargo.toml
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml
