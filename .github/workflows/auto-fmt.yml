name: Auto Format

on:
  push:
    branches: [rust-rewrite]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fmt:
    name: Auto-format Rust code
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-10-23
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --manifest-path rust/Cargo.toml

      - name: Check for changes
        id: fmt-check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet rust/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No formatting changes needed"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Formatting changes detected"
          fi

      - name: Commit and push formatting changes
        if: steps.fmt-check.outputs.changed == 'true'
        shell: bash
        run: |
          git add rust/
          git commit -m $'style: auto-format with rustfmt\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>'
          git push