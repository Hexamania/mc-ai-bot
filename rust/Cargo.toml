[package]
name = "mc-ai-bot-core"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false

# Patch simd_cesu8 to fix array_chunks issue on Rust 1.85+
# The fix changes `remainder.array_chunks()` to `remainder.into_iter().array_chunks()`
[patch.crates-io]
simd_cesu8 = { git = "https://github.com/bevyengine/simd_cesu8", rev = "main" }

[dependencies]
azalea = "=0.10.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "json", "form", "ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = "9"
rand = { version = "=0.8.5", features = ["small_rng"] }
serde = { version = "=1.0.198", features = ["derive"] }
serde_json = "1"
socketioxide = "0.10"
tempfile = "3"
thiserror = "2"
time = "=0.3.55"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "fs",
] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
