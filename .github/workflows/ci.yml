# Airi OS CI/CD Pipeline
# Runs on every push and pull request to main branch

name: CI/CD Pipeline

on:
  push:
    branches: [main, dev-*]
  pull_request:
    branches: [main]
  release:
    types: [published]

# Global environment variables
env:
  NODE_VERSION: '20.x'
  ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
  ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

jobs:
  # ===========================================================================
  # Lint & Type Check
  # ===========================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check .

      - name: TypeScript type check (root)
        run: npx tsc --noEmit -p tsconfig.json

      - name: TypeScript type check (desktop)
        run: npx tsc --noEmit -p desktop/tsconfig.json

      - name: TypeScript type check (renderer)
        run: npx tsc --noEmit -p desktop/renderer/tsconfig.json

  # ===========================================================================
  # Build
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build main TypeScript
        run: npm run build

      - name: Build desktop main process
        run: npm run build:main

      - name: Build desktop renderer
        run: npm run build:renderer

      - name: Verify build output
        run: |
          ls -la dist/
          ls -la dist/desktop/
          ls -la dist/desktop/renderer/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            !dist/*.exe
            !dist/*.AppImage
            !dist/*.dmg
          retention-days: 7

  # ===========================================================================
  # Test (placeholder - add actual tests when available)
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true  # Remove this when tests are implemented

  # ===========================================================================
  # Build Electron App (Windows)
  # ===========================================================================
  build-electron-windows:
    name: Build Electron (Windows)
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev-')) || github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Build Electron app (NSIS + Portable)
        run: npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List installer artifacts
        run: ls -la dist/

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe
          retention-days: 30

  # ===========================================================================
  # Create Release
  # ===========================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-electron-windows]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: ./installers

      - name: List installer files
        run: ls -la ./installers/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./installers/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Dependency Review (Security)
  # ===========================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # ===========================================================================
  # CodeQL Analysis (Security)
  # ===========================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"