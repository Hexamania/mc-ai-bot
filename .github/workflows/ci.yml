# Airi OS CI/CD Pipeline
# Runs on every push and pull request to main branch

name: CI/CD Pipeline

on:
  push:
    branches: [main, dev-*]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier check
        run: npx prettier --check .
      - name: TypeScript type check (root)
        run: npx tsc --noEmit -p tsconfig.json
      - name: TypeScript type check (desktop)
        run: npx tsc --noEmit -p desktop/tsconfig.json
      - name: TypeScript type check (renderer)
        run: npx tsc --noEmit -p desktop/renderer/tsconfig.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build main TypeScript
        run: npm run build
      - name: Build desktop main process
        run: npm run build:main
      - name: Build desktop renderer
        run: npm run build:renderer
      - name: Verify build output
        run: |
          ls -la dist/
          ls -la dist/desktop/
          ls -la dist/desktop/renderer/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            !dist/*.exe
            !dist/*.AppImage
            !dist/*.dmg
          retention-days: 7
